name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clippy
        run: cargo clippy --manifest-path basis-cli/Cargo.toml -- -D warnings

      - name: Test basis-cli
        run: cargo test --manifest-path basis-cli/Cargo.toml

      - name: Self-check
        run: cargo run --manifest-path basis-cli/Cargo.toml -- check --spec basis.yaml .

  publish-crate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --manifest-path basis-cli/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
