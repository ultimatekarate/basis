governance:
  version: "1.0"
  model: linguistic
  check_tests: false

# Basis governs itself
#
# Functional core:
#   Dictionary    — Inert nouns. Data types and configuration structures.
#   Laboratory    — Pure logic. Validation, checking, reporting.
#
# Imperative shell:
#   spec-loader     — Bridges filesystem → dictionary types. Fetches remote specs.
#   check-engine    — Reusable check orchestration, inference, code generation.
#   cli-runner      — CLI entry point. Argument parsing, output formatting.
#   language-server — LSP process. Watches files, pushes diagnostics to editors.
#
# Network IO is quarantined to spec-loader via boundary deny rules.
# External layers group third-party packages by concern domain.
# Internal layers access external packages through depends_on,
# using the same structural dependency mechanism as internal code.

# External Layers (tool groups)

layers:
  serialization:
    external: true
    role: "Serialization and deserialization"
    packages: [serde, thiserror]

  parsing:
    external: true
    role: "File format parsing and pattern matching"
    packages: [serde_yaml, regex, pyyaml]

  cli:
    external: true
    role: "Command-line argument parsing"
    packages: [clap]

  rust-internal:
    external: true
    role: "Rust language-internal imports (crate-relative, std library)"
    packages: [crate, super, self, std, core, alloc]

  network-io:
    external: true
    role: "HTTP client for remote spec fetching"
    packages: [ureq]

  all-external:
    external: true
    role: "Unrestricted external access"
    packages: ["*"]

# Internal Layers

  dictionary:
    role: "Inert nouns. Governance spec data types, error types, configuration structures."
    packages:
      - "basis-cli/src/spec"
    rules:
      purity: strict
      io: forbidden
      network: forbidden
      async: forbidden
    depends_on: [serialization, rust-internal]

  laboratory:
    role: "Pure logic. Spec validation, report generation."
    packages:
      # Rust
      - "basis-cli/src/validate"
      - "basis-cli/src/report"
    rules:
      purity: strict
      io: forbidden
      network: forbidden
      async: forbidden
    depends_on:
      - dictionary
      - serialization
      - parsing
      - rust-internal

  spec-loader:
    role: "Bridges filesystem to dictionary types. Reads and parses basis.yaml."
    packages:
      - "basis-cli/src/loader"
    rules:
      purity: relaxed
      io: allowed
    depends_on:
      - dictionary
      - network-io
      - all-external

  check-engine:
    role: "Reusable check orchestration, code generation, inference, language definitions."
    packages:
      - "basis-cli/src/check"
      - "basis-cli/src/generate"
      - "basis-cli/src/infer"
      - "basis-cli/src/language"
    rules:
      purity: relaxed
      io: allowed
    depends_on:
      - dictionary
      - laboratory
      - spec-loader
      - rust-internal
      - all-external

  cli-runner:
    role: "CLI entry point. Argument parsing, output formatting, process exit."
    packages:
      - "basis-cli/src/main"
    rules:
      purity: relaxed
      io: allowed
    depends_on:
      - check-engine
      - language-server
      - laboratory
      - spec-loader
      - cli
      - all-external

  language-server:
    role: "Long-lived LSP process. Watches files, pushes diagnostics to editors."
    packages:
      - "basis-cli/src/lsp"
    rules:
      purity: relaxed
      io: allowed
    depends_on:
      - check-engine
      - spec-loader
      - rust-internal
      - all-external


# Values Axis 

newtypes:
  enabled: true
  types:
    - name: LayerName
      wraps: string
    - name: PackagePath
      wraps: string
    - name: SpecVersion
      wraps: string

# Completeness Axis 

exhaustive_matching:
  enabled: true
  unions:
    - name: CheckResult
      variants:
        - Pass
        - Violation
        - Skipped
    - name: Axis
      variants:
        - Values
        - Placement
        - Completeness
        - Purity
        - Granularity
    - name: BoundaryAction
      variants:
        - Allow
        - Deny
    - name: PurityLevel
      variants:
        - Strict
        - Relaxed

# Purity Axis

purity:
  enabled: true
  forbidden_in_strict:
    - "file_io"
    - "network_io"
    - "stdout"
    - "stderr"
    - "env_vars"
    - "system_clock"
    - "dynamic_execution"
    - "subprocess"
    - "process"

# Placement Axis

boundaries:
  enabled: true
  rules:
    - from: dictionary
      to: network-io
      action: deny
      reason: "data types must not perform network IO"
    - from: laboratory
      to: network-io
      action: deny
      reason: "pure logic must not perform network IO"
    - from: check-engine
      to: network-io
      action: deny
      reason: "only spec-loader may fetch remote specs"
    - from: cli-runner
      to: network-io
      action: deny
      reason: "only spec-loader may fetch remote specs"
    - from: language-server
      to: network-io
      action: deny
      reason: "only spec-loader may fetch remote specs"

# Granularity Axis 
#
# Per-file line budget. Tests are intentionally counted: a 2000-line test
# file inflates an agent's context window the same as a 2000-line production
# file when read. The budget bounds that cost.

granularity:
  enabled: true
  max_lines: 800
