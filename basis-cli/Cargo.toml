[package]
name = "basis-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for Basis architectural governance"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
ureq = "2"
lsp-server = "0.7"
lsp-types = "0.97"
notify = { version = "6", features = ["macos_fsevent"] }

[dev-dependencies]
tempfile = "3"
